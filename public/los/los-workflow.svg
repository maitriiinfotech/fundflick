<svg width="1440" height="1340" viewBox="0 0 1440 1340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0B1B33" flood-opacity="0.12"/>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .flow-dot { animation: flowmove 7s linear infinite; }
      @keyframes flowmove {
        0%   { transform: translateX(0px); opacity: 0; }
        6%   { opacity: 1; }
        92%  { opacity: 1; }
        100% { transform: translateX(1048px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-dot { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="16" width="1408" height="1308" rx="30" fill="#FFFFFF" stroke="#E2E6ED" stroke-width="1"/>
  </g>

  <!-- Header -->
  <text x="76" y="112" font-size="20" font-weight="700" letter-spacing="2.5" fill="#5B6B82">LENDING OPERATIONS SUITE</text>
  <text x="76" y="184" font-size="56" font-weight="800" fill="#0B1B33">Loan Origination System</text>
  <text x="76" y="228" font-size="26" font-weight="500" fill="#5B6B82">Apply, score &amp; disburse — automated end to end</text>

  <circle cx="1356" cy="110" r="5" fill="#E5172A"/>
  <text x="1348" y="116" text-anchor="end" font-size="20" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>
  <text x="1348" y="142" text-anchor="end" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5B6B82">VISUAL WORKFLOW</text>

  <!-- Connector segments + arrowheads -->
  <g stroke="#0B1B33" stroke-opacity="0.25" stroke-width="2.6">
    <line x1="196" y1="560" x2="404" y2="560"/>
    <line x1="476" y1="560" x2="684" y2="560"/>
    <line x1="756" y1="560" x2="964" y2="560"/>
    <line x1="1036" y1="560" x2="1244" y2="560"/>
  </g>
  <g fill="#0B1B33" fill-opacity="0.35">
    <polygon points="401,553 411,560 401,567"/>
    <polygon points="681,553 691,560 681,567"/>
    <polygon points="961,553 971,560 961,567"/>
    <polygon points="1241,553 1251,560 1241,567"/>
  </g>

  <!-- Animated flow dot -->
  <g class="flow-dot" transform="translate(196,560)" style="opacity:0">
    <circle r="8" fill="#E5172A" filter="url(#dotGlow)"/>
  </g>

  <!-- ===== STAGE 1: Application (cx=160) ===== -->
  <g>
    <text x="160" y="452" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1" fill="#E5172A">01</text>
    <circle cx="160" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
    <g transform="translate(160,560) scale(1.7)">
      <rect x="-12" y="-15" width="20" height="30" rx="2" fill="none" stroke="#0B1B33" stroke-width="2"/>
      <line x1="-7" y1="-6" x2="4" y2="-6" stroke="#0B1B33" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-7" y1="0" x2="6" y2="0" stroke="#0B1B33" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-7" y1="6" x2="2" y2="6" stroke="#0B1B33" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="9" cy="11" r="4" fill="#E5172A"/>
    </g>
    <text x="160" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Application</text>
    <text x="160" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Web, app &amp;</text>
    <text x="160" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">agent intake</text>
  </g>

  <!-- ===== STAGE 2: eKYC & Verify (cx=440) ===== -->
  <g>
    <text x="440" y="452" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1" fill="#E5172A">02</text>
    <circle cx="440" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
    <g transform="translate(440,560) scale(1.7)">
      <rect x="-16" y="-11" width="32" height="22" rx="3" fill="none" stroke="#0B1B33" stroke-width="2"/>
      <circle cx="-7" cy="-2" r="3.6" fill="none" stroke="#0B1B33" stroke-width="1.5"/>
      <path d="M -11.5,6 Q -7,1.5 -2.5,6" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-3" x2="12" y2="-3" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="2" x2="10" y2="2" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="11" cy="8" r="5" fill="#E5172A"/>
      <path d="M 9,8 L 10.4,9.4 L 13,6.4" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="440" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Verification</text>
    <text x="440" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Instant eKYC &amp;</text>
    <text x="440" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">bureau fetch</text>
  </g>

  <!-- ===== STAGE 3: Credit Score (cx=720) ===== -->
  <g>
    <text x="720" y="452" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1" fill="#E5172A">03</text>
    <circle cx="720" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
    <g transform="translate(720,560) scale(1.7)">
      <path d="M -13,8 A 13,13 0 1 1 13,8" fill="none" stroke="#0B1B33" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="8" y2="-6" stroke="#E5172A" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="2.6" fill="#0B1B33"/>
    </g>
    <text x="720" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Underwriting</text>
    <text x="720" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">AI scoring &amp;</text>
    <text x="720" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">fraud detection</text>
  </g>

  <!-- ===== STAGE 4: Approval (cx=1000) ===== -->
  <g>
    <text x="1000" y="452" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1" fill="#E5172A">04</text>
    <circle cx="1000" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
    <g transform="translate(1000,560) scale(1.7)">
      <path d="M 0,-15 L 12,-9 L 12,3 C 12,11 6,16 0,18 C -6,16 -12,11 -12,3 L -12,-9 Z" fill="none" stroke="#0B1B33" stroke-width="2"/>
      <path d="M -6,1 L -1,7 L 7,-6" fill="none" stroke="#E5172A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1000" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Approval</text>
    <text x="1000" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Custom rules &amp;</text>
    <text x="1000" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">multi-level sign-off</text>
  </g>

  <!-- ===== STAGE 5: Disbursal (cx=1280) ===== -->
  <g>
    <text x="1280" y="452" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1" fill="#E5172A">05</text>
    <circle cx="1280" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
    <g transform="translate(1280,560) scale(1.7)">
      <path d="M -13,-9 L 0,-16 L 13,-9 Z" fill="#0B1B33"/>
      <line x1="-14" y1="-6" x2="14" y2="-6" stroke="#0B1B33" stroke-width="2"/>
      <line x1="-7" y1="-4" x2="-7" y2="8" stroke="#0B1B33" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-4" x2="0" y2="8" stroke="#0B1B33" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="7" y1="-4" x2="7" y2="8" stroke="#0B1B33" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="-14" y1="10" x2="14" y2="10" stroke="#0B1B33" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="13" cy="12" r="5" fill="#E5172A"/>
      <path d="M 11,12 L 15,12 M 13.5,10 L 15.5,12 L 13.5,14" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1280" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Disbursal</text>
    <text x="1280" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Instant bank</text>
    <text x="1280" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">transfers</text>
  </g>

  <!-- Divider -->
  <line x1="76" y1="900" x2="1364" y2="900" stroke="#E2E6ED" stroke-width="1.4"/>

  <!-- Stats -->
  <text x="720" y="978" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#5B6B82">RESULTS AT A GLANCE</text>

  <text x="304" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">4–5 min</text>
  <text x="304" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">SIMPLE APPROVALS</text>

  <line x1="512" y1="1036" x2="512" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>

  <text x="720" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#E5172A">90%</text>
  <text x="720" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">LESS MANUAL EFFORT</text>

  <line x1="928" y1="1036" x2="928" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>

  <text x="1136" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">25–30 min</text>
  <text x="1136" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">COMPLEX CASES</text>

  <text x="720" y="1228" text-anchor="middle" font-size="20" font-weight="500" letter-spacing="0.3" fill="#5B6B82">Bank-grade security (AES-256) · REST APIs &amp; Webhooks · Built for NBFCs &amp; lenders</text>

</svg>
