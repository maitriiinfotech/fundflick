<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Back office multi-stage verification">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
      .pulse { animation: blink 1.6s ease-in-out infinite; transform-box: fill-box; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
    </style>
  </defs>

  <text x="40" y="56" font-size="30" font-weight="800" fill="#0B1B33">Back Office Review</text>
  <text x="40" y="86" font-size="15" font-weight="500" fill="#5B6B82">Multi-stage verification · file held until every stage clears</text>
  <text x="840" y="52" text-anchor="end" font-size="14" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>

  <rect x="40" y="116" width="800" height="404" rx="16" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>

  <!-- stage rows -->
  <g font-size="15" font-weight="600" fill="#0B1B33">
    <!-- 1 eKYC -->
    <text x="66" y="172">eKYC Verification</text>
    <rect x="66" y="186" width="560" height="8" rx="4" fill="#E2E6ED"/>
    <rect x="66" y="186" width="560" height="8" rx="4" fill="#10B981"/>
    <rect x="664" y="156" width="150" height="28" rx="14" fill="#10B981" opacity="0.14"/>
    <text x="739" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E9F6E">Done · 100%</text>

    <!-- 2 CIBIL -->
    <text x="66" y="240">CIBIL Check</text>
    <rect x="66" y="254" width="560" height="8" rx="4" fill="#E2E6ED"/>
    <rect x="66" y="254" width="560" height="8" rx="4" fill="#10B981"/>
    <rect x="664" y="224" width="150" height="28" rx="14" fill="#10B981" opacity="0.14"/>
    <text x="739" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E9F6E">Done · 100%</text>

    <!-- 3 Tele-Verification (in progress) -->
    <text x="66" y="308">Tele-Verification</text>
    <rect x="66" y="322" width="560" height="8" rx="4" fill="#E2E6ED"/>
    <rect x="66" y="322" width="336" height="8" rx="4" fill="#F59E0B"/>
    <rect x="664" y="292" width="150" height="28" rx="14" fill="#F59E0B" opacity="0.16"/>
    <circle class="pulse" cx="686" cy="306" r="4" fill="#D97706"/>
    <text x="749" y="310" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B45309">In review · 60%</text>

    <!-- 4 Document Review -->
    <text x="66" y="376">Document Review</text>
    <rect x="66" y="390" width="560" height="8" rx="4" fill="#E2E6ED"/>
    <rect x="664" y="360" width="150" height="28" rx="14" fill="#0B1B33" opacity="0.06"/>
    <text x="739" y="378" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5B6B82">Pending</text>

    <!-- 5 Income Verification -->
    <text x="66" y="444">Income Verification</text>
    <rect x="66" y="458" width="560" height="8" rx="4" fill="#E2E6ED"/>
    <rect x="664" y="428" width="150" height="28" rx="14" fill="#0B1B33" opacity="0.06"/>
    <text x="739" y="446" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5B6B82">Pending</text>
  </g>

  <text x="66" y="500" font-size="12.5" font-weight="600" fill="#5B6B82">Stage 3 of 5 in progress · file cannot move to approval until all clear</text>
</svg>
