<svg width="1440" height="1340" viewBox="0 0 1440 1340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bookkeeping and Accounts visual workflow">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0B1B33" flood-opacity="0.12"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .flow-dot { animation: flowmove 7s linear infinite; }
      @keyframes flowmove {
        0%   { transform: translateX(0px);    opacity: 0; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { transform: translateX(1048px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-dot { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card -->
  <rect x="16" y="16" width="1408" height="1308" rx="30" fill="#FFFFFF" stroke="#E2E6ED" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Header -->
  <text x="76" y="112" font-size="20" font-weight="700" letter-spacing="2.5" fill="#5B6B82">LENDING OPERATIONS SUITE</text>
  <text x="76" y="184" font-size="56" font-weight="800" fill="#0B1B33">Bookkeeping &amp; Accounts</text>
  <text x="76" y="228" font-size="26" font-weight="500" fill="#5B6B82">Log, post &amp; reconcile — books that stay audit-ready</text>

  <!-- Beta badge -->
  <rect x="760" y="146" width="118" height="46" rx="23" fill="none" stroke="#E5172A" stroke-width="1.8"/>
  <text x="819" y="177" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1.5" fill="#E5172A">BETA</text>

  <!-- Top-right brand -->
  <circle cx="1356" cy="110" r="5" fill="#E5172A"/>
  <text x="1348" y="116" text-anchor="end" font-size="20" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>
  <text x="1348" y="142" text-anchor="end" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5B6B82">VISUAL WORKFLOW</text>

  <!-- Connectors -->
  <g stroke="#0B1B33" stroke-width="2.6" opacity="0.25" stroke-linecap="round">
    <line x1="226" y1="560" x2="368" y2="560"/>
    <line x1="506" y1="560" x2="648" y2="560"/>
    <line x1="786" y1="560" x2="928" y2="560"/>
    <line x1="1066" y1="560" x2="1208" y2="560"/>
  </g>
  <g fill="#0B1B33" opacity="0.35">
    <path d="M374 560 l-10 -5 v10 Z"/>
    <path d="M654 560 l-10 -5 v10 Z"/>
    <path d="M934 560 l-10 -5 v10 Z"/>
    <path d="M1214 560 l-10 -5 v10 Z"/>
  </g>

  <!-- Animated flow dot -->
  <g transform="translate(196,560)">
    <g class="flow-dot">
      <circle r="8" fill="#E5172A" filter="url(#dotGlow)"/>
    </g>
  </g>

  <!-- ============ STAGE 01 — Transactions ============ -->
  <text x="160" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">01</text>
  <circle cx="160" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(160,560) scale(1.9)" fill="none" stroke="#0B1B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -9,-14 h18 v28 l-3,-2.5 l-3,2.5 l-3,-2.5 l-3,2.5 l-3,-2.5 Z"/>
    <line x1="-4.5" y1="-7" x2="4.5" y2="-7" stroke-width="1.4"/>
    <line x1="-4.5" y1="-2" x2="4.5" y2="-2" stroke-width="1.4"/>
    <line x1="-4.5" y1="3" x2="1" y2="3" stroke-width="1.4" stroke="#E5172A"/>
  </g>
  <text x="160" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Transactions</text>
  <text x="160" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Accurate logging</text>
  <text x="160" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">of every entry</text>

  <!-- ============ STAGE 02 — Ledgers ============ -->
  <text x="440" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">02</text>
  <circle cx="440" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(440,560) scale(1.9)" fill="none" stroke="#0B1B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -12,-12 v24 h11 v-24 a3 3 0 0 0 -6 0 a3 3 0 0 0 -5 0 Z"/>
    <line x1="-1" y1="-12" x2="-1" y2="12"/>
    <line x1="-9" y1="-6" x2="-4" y2="-6" stroke-width="1.3"/>
    <circle cx="6" cy="6" r="3.4" fill="#E5172A" stroke="none"/>
  </g>
  <text x="440" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Ledgers</text>
  <text x="440" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Auto-posted</text>
  <text x="440" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">double-entry</text>

  <!-- ============ STAGE 03 — GST & TDS ============ -->
  <text x="720" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">03</text>
  <circle cx="720" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(720,560) scale(1.9)" fill="none" stroke="#0B1B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-11" y="-13" width="22" height="26" rx="2.5"/>
    <circle cx="-4" cy="-5" r="2.2" stroke="#E5172A"/>
    <circle cx="4" cy="5" r="2.2" stroke="#E5172A"/>
    <line x1="6" y1="-7" x2="-6" y2="7" stroke="#E5172A" stroke-width="1.8"/>
  </g>
  <text x="720" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">GST &amp; TDS</text>
  <text x="720" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Auto-built</text>
  <text x="720" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">worksheets</text>

  <!-- ============ STAGE 04 — Trial Balance ============ -->
  <text x="1000" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">04</text>
  <circle cx="1000" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1000,560) scale(1.9)" fill="none" stroke="#0B1B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-13" x2="0" y2="11"/>
    <line x1="-11" y1="-9" x2="11" y2="-9"/>
    <path d="M -11,-9 L -14,-1 a3 3 0 0 0 6 0 Z" fill="#FFFFFF"/>
    <path d="M 11,-9 L 8,-1 a3 3 0 0 0 6 0 Z" fill="#FFFFFF"/>
    <path d="M -5,12 h10" stroke="#E5172A"/>
  </g>
  <text x="1000" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Trial Balance</text>
  <text x="1000" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">One-click</text>
  <text x="1000" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">generation</text>

  <!-- ============ STAGE 05 — Reconciliation ============ -->
  <text x="1280" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">05</text>
  <circle cx="1280" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1280,560) scale(1.9)" fill="none" stroke="#0B1B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -12,-6 h18 l-4,-4 M 12,6 h-18 l4,4"/>
    <path d="M -3,-1 l 2.5,2.5 l 5,-5.5" stroke="#E5172A"/>
  </g>
  <text x="1280" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Reconciliation</text>
  <text x="1280" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Bank statement</text>
  <text x="1280" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">matching</text>

  <!-- Divider -->
  <line x1="76" y1="900" x2="1364" y2="900" stroke="#E2E6ED" stroke-width="1.4"/>

  <!-- Stats -->
  <text x="720" y="978" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#5B6B82">KEY CAPABILITIES</text>

  <line x1="512" y1="1036" x2="512" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>
  <line x1="928" y1="1036" x2="928" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>

  <text x="304" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">Double</text>
  <text x="304" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">ENTRY LEDGERS</text>

  <text x="720" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#E5172A">GST / TDS</text>
  <text x="720" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">WORKSHEETS</text>

  <text x="1136" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">1-click</text>
  <text x="1136" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">TRIAL BALANCE</text>

  <!-- Footer -->
  <text x="720" y="1228" text-anchor="middle" font-size="20" font-weight="500" letter-spacing="0.3" fill="#5B6B82">Auto-posted ledgers · Bank reconciliation · Built for NBFCs &amp; lenders</text>
</svg>
