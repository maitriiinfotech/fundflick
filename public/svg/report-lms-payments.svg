<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LMS payment reports">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5172A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E5172A" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
      .pulse { animation: blink 1.7s ease-in-out infinite; transform-box: fill-box; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
    </style>
  </defs>

  <text x="40" y="56" font-size="30" font-weight="800" fill="#0B1B33">LMS Payment Reports</text>
  <text x="40" y="86" font-size="15" font-weight="500" fill="#5B6B82">Daily &amp; monthly collections · method breakdown</text>
  <text x="840" y="52" text-anchor="end" font-size="14" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>

  <!-- left: monthly trend area chart -->
  <rect x="40" y="116" width="486" height="404" rx="16" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
  <text x="66" y="152" font-size="15" font-weight="700" fill="#0B1B33">Monthly collection</text>
  <text x="66" y="174" font-size="12" font-weight="500" fill="#5B6B82">₹ in crore · last 7 months</text>
  <line x1="66" y1="452" x2="500" y2="452" stroke="#E2E6ED" stroke-width="1.4"/>

  <polygon points="86,400 150,382 214,392 278,352 342,322 406,300 470,262 470,452 86,452" fill="url(#area)"/>
  <polyline points="86,400 150,382 214,392 278,352 342,322 406,300 470,262" fill="none" stroke="#E5172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#E5172A" stroke-width="2.5">
    <circle cx="86" cy="400" r="4"/><circle cx="150" cy="382" r="4"/><circle cx="214" cy="392" r="4"/>
    <circle cx="278" cy="352" r="4"/><circle cx="342" cy="322" r="4"/><circle cx="406" cy="300" r="4"/>
  </g>
  <circle class="pulse" cx="470" cy="262" r="6" fill="#E5172A"/>
  <g font-size="11" font-weight="600" fill="#5B6B82" text-anchor="middle">
    <text x="86" y="474">Jan</text><text x="150" y="474">Feb</text><text x="214" y="474">Mar</text>
    <text x="278" y="474">Apr</text><text x="342" y="474">May</text><text x="406" y="474">Jun</text>
    <text x="470" y="474" fill="#E5172A" font-weight="800">Jul</text>
  </g>

  <!-- right: payment methods -->
  <rect x="546" y="116" width="294" height="404" rx="16" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
  <text x="572" y="152" font-size="15" font-weight="700" fill="#0B1B33">Payment methods</text>
  <text x="572" y="174" font-size="12" font-weight="500" fill="#5B6B82">share of collections</text>
  <g font-size="13">
    <text x="572" y="216" font-weight="600" fill="#0B1B33">UPI</text>
    <text x="814" y="216" text-anchor="end" font-weight="800" fill="#0B1B33">46%</text>
    <rect x="572" y="226" width="242" height="9" rx="4.5" fill="#E2E6ED"/>
    <rect x="572" y="226" width="111" height="9" rx="4.5" fill="#E5172A"/>

    <text x="572" y="270" font-weight="600" fill="#0B1B33">NACH</text>
    <text x="814" y="270" text-anchor="end" font-weight="800" fill="#0B1B33">28%</text>
    <rect x="572" y="280" width="242" height="9" rx="4.5" fill="#E2E6ED"/>
    <rect x="572" y="280" width="68" height="9" rx="4.5" fill="#8A98AD"/>

    <text x="572" y="324" font-weight="600" fill="#0B1B33">Netbanking</text>
    <text x="814" y="324" text-anchor="end" font-weight="800" fill="#0B1B33">16%</text>
    <rect x="572" y="334" width="242" height="9" rx="4.5" fill="#E2E6ED"/>
    <rect x="572" y="334" width="39" height="9" rx="4.5" fill="#8A98AD"/>

    <text x="572" y="378" font-weight="600" fill="#0B1B33">Cash &amp; QR</text>
    <text x="814" y="378" text-anchor="end" font-weight="800" fill="#0B1B33">10%</text>
    <rect x="572" y="388" width="242" height="9" rx="4.5" fill="#E2E6ED"/>
    <rect x="572" y="388" width="24" height="9" rx="4.5" fill="#8A98AD"/>
  </g>

  <rect x="572" y="442" width="242" height="54" rx="12" fill="#0B1B33"/>
  <text x="592" y="466" font-size="11" font-weight="600" letter-spacing="1" fill="#8EA0BC">COLLECTED MTD</text>
  <text x="592" y="487" font-size="19" font-weight="800" fill="#FFFFFF">₹18.4 Cr</text>
</svg>
