<svg width="504" height="476" viewBox="48 52 504 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lending system overview dashboard">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5172A"/>
      <stop offset="1" stop-color="#B30E1E"/>
    </linearGradient>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .live-dot { animation: blink 1.6s ease-in-out infinite; transform-box: fill-box; }
      .bar-live { animation: barpulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes barpulse { 0%,100% { transform: scaleY(.78) } 50% { transform: scaleY(1) } }
      @media (prefers-reduced-motion: reduce) {
        .live-dot, .bar-live { animation: none; }
      }
    </style>
  </defs>

  <!-- top bar -->
  <circle cx="68" cy="80" r="5" fill="#E5172A"/>
  <circle cx="86" cy="80" r="5" fill="#C9CFD8"/>
  <circle cx="104" cy="80" r="5" fill="#C9CFD8"/>
  <text x="130" y="86" font-size="18" font-weight="800" fill="#0B1B33">Lending Overview</text>
  <rect x="468" y="68" width="72" height="26" rx="13" fill="#E5172A" opacity="0.1"/>
  <circle class="live-dot" cx="486" cy="81" r="3.5" fill="#E5172A"/>
  <text x="498" y="85" font-size="11" font-weight="700" letter-spacing="1" fill="#E5172A">LIVE</text>
  <line x1="64" y1="108" x2="532" y2="108" stroke="#E2E6ED" stroke-width="1"/>

  <!-- KPI cards -->
  <g>
    <rect x="64" y="124" width="148" height="80" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
    <text x="80" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#5B6B82">DISBURSED</text>
    <text x="80" y="180" font-size="26" font-weight="800" fill="#0B1B33">₹120Cr</text>
    <text x="80" y="196" font-size="10.5" font-weight="700" fill="#10B981">▲ 12% MoM</text>
  </g>
  <g>
    <rect x="224" y="124" width="148" height="80" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
    <text x="240" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#5B6B82">ACTIVE LOANS</text>
    <text x="240" y="180" font-size="26" font-weight="800" fill="#0B1B33">8,420</text>
    <text x="240" y="196" font-size="10.5" font-weight="700" fill="#10B981">▲ 5% MoM</text>
  </g>
  <g>
    <rect x="384" y="124" width="148" height="80" rx="14" fill="#0B1B33"/>
    <text x="400" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#F1A7AD">APPROVAL</text>
    <text x="400" y="180" font-size="26" font-weight="800" fill="#FFFFFF">92%</text>
    <text x="400" y="196" font-size="10.5" font-weight="700" fill="#48E59A">▲ 3% MoM</text>
  </g>

  <!-- chart card -->
  <rect x="64" y="220" width="280" height="148" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
  <text x="82" y="246" font-size="11" font-weight="700" fill="#0B1B33">Disbursal trend</text>
  <text x="82" y="262" font-size="9.5" font-weight="500" fill="#5B6B82">Last 6 months</text>
  <line x1="82" y1="346" x2="326" y2="346" stroke="#E2E6ED" stroke-width="1"/>
  <g>
    <rect x="92"  y="316" width="26" height="30" rx="4" fill="#E1E5EB"/>
    <rect x="130" y="304" width="26" height="42" rx="4" fill="#D2D8E1"/>
    <rect x="168" y="320" width="26" height="26" rx="4" fill="#E1E5EB"/>
    <rect x="206" y="294" width="26" height="52" rx="4" fill="#B9C2D0"/>
    <rect x="244" y="282" width="26" height="64" rx="4" fill="#8A98AD"/>
    <rect class="bar-live" x="282" y="266" width="26" height="80" rx="4" fill="url(#redGrad)"/>
  </g>

  <!-- approval donut -->
  <rect x="356" y="220" width="176" height="148" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
  <text x="374" y="246" font-size="11" font-weight="700" fill="#0B1B33">Approval rate</text>
  <circle cx="444" cy="306" r="42" fill="none" stroke="#E2E6ED" stroke-width="12"/>
  <circle cx="444" cy="306" r="42" fill="none" stroke="#E5172A" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="243 264" transform="rotate(-90 444 306)"/>
  <text x="444" y="304" text-anchor="middle" font-size="24" font-weight="800" fill="#0B1B33">92%</text>
  <text x="444" y="322" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5B6B82">approved</text>

  <!-- recent loans list -->
  <rect x="64" y="384" width="468" height="84" rx="14" fill="#FFFFFF" stroke="#E2E6ED" stroke-width="1"/>
  <g>
    <circle cx="86" cy="410" r="6" fill="#E5172A"/>
    <text x="102" y="414" font-size="11.5" font-weight="600" fill="#0B1B33">Rahul Sharma · ₹4.5L · Personal</text>
    <rect x="430" y="400" width="86" height="20" rx="10" fill="#10B981" opacity="0.14"/>
    <text x="473" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#0E9F6E">Approved</text>
  </g>
  <line x1="80" y1="426" x2="516" y2="426" stroke="#EFF1F4" stroke-width="1"/>
  <g>
    <circle cx="86" cy="444" r="6" fill="#0B1B33"/>
    <text x="102" y="448" font-size="11.5" font-weight="600" fill="#0B1B33">Priya Mehta · ₹12L · Business</text>
    <rect x="430" y="434" width="86" height="20" rx="10" fill="#E5172A" opacity="0.12"/>
    <text x="473" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#E5172A">Disbursed</text>
  </g>

  <!-- footer caption -->
  <text x="300" y="512" text-anchor="middle" font-size="11" font-weight="500" fill="#8A93A3">One platform · origination to disbursal · built for NBFCs</text>
</svg>
