<svg width="1440" height="1340" viewBox="0 0 1440 1340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Collection Management System visual workflow">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0B1B33" flood-opacity="0.12"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .flow-dot { animation: flowmove 7s linear infinite; }
      @keyframes flowmove {
        0%   { transform: translateX(0px);    opacity: 0; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { transform: translateX(1048px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-dot { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card -->
  <rect x="16" y="16" width="1408" height="1308" rx="30" fill="#FFFFFF" stroke="#E2E6ED" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Header -->
  <text x="76" y="112" font-size="20" font-weight="700" letter-spacing="2.5" fill="#5B6B82">LENDING OPERATIONS SUITE</text>
  <text x="76" y="184" font-size="56" font-weight="800" fill="#0B1B33">Collection Management System</text>
  <text x="76" y="228" font-size="26" font-weight="500" fill="#5B6B82">Assign, follow up &amp; recover — tracked end to end</text>

  <!-- Top-right brand -->
  <circle cx="1356" cy="110" r="5" fill="#E5172A"/>
  <text x="1348" y="116" text-anchor="end" font-size="20" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>
  <text x="1348" y="142" text-anchor="end" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5B6B82">VISUAL WORKFLOW</text>

  <!-- Connectors -->
  <g stroke="#0B1B33" stroke-width="2.6" opacity="0.25" stroke-linecap="round">
    <line x1="226" y1="560" x2="368" y2="560"/>
    <line x1="506" y1="560" x2="648" y2="560"/>
    <line x1="786" y1="560" x2="928" y2="560"/>
    <line x1="1066" y1="560" x2="1208" y2="560"/>
  </g>
  <g fill="#0B1B33" opacity="0.35">
    <path d="M374 560 l-10 -5 v10 Z"/>
    <path d="M654 560 l-10 -5 v10 Z"/>
    <path d="M934 560 l-10 -5 v10 Z"/>
    <path d="M1214 560 l-10 -5 v10 Z"/>
  </g>

  <!-- Animated flow dot -->
  <g transform="translate(196,560)">
    <g class="flow-dot">
      <circle r="8" fill="#E5172A" filter="url(#dotGlow)"/>
    </g>
  </g>

  <!-- ============ STAGE 01 — Case Assignment ============ -->
  <text x="160" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">01</text>
  <circle cx="160" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(160,560) scale(1.7)" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-8" cy="-7.5" r="3.4"/>
    <path d="M-13.5 4.5 C-13.5 -1.5 -2.5 -1.5 -2.5 4.5"/>
    <rect x="3" y="-9" width="11.5" height="15" rx="1.8"/>
    <path d="M6 -9 v-2 h5.5 v2"/>
    <path d="M5.5 -0.5 h6.5 M5.5 3 h4"/>
    <path stroke="#E5172A" d="M5.2 -4 l1.6 1.6 l3.2 -3.8"/>
  </g>
  <text x="160" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Case Assignment</text>
  <text x="160" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Agent &amp; branch-wise</text>
  <text x="160" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">case allocation</text>

  <!-- ============ STAGE 02 — Field & Telecall ============ -->
  <text x="440" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">02</text>
  <circle cx="440" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(440,560) scale(1.7)" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -12.5 C5.5 -12.5 8.5 -8.5 8.5 -4 C8.5 2 0 11.5 0 11.5 C0 11.5 -8.5 2 -8.5 -4 C-8.5 -8.5 -5.5 -12.5 0 -12.5 Z"/>
    <circle cx="0" cy="-4" r="3.1" stroke="#E5172A"/>
  </g>
  <text x="440" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Field &amp; Telecall</text>
  <text x="440" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Visits, calls &amp;</text>
  <text x="440" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">PTP logging</text>

  <!-- ============ STAGE 03 — Proof & Notices ============ -->
  <text x="720" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">03</text>
  <circle cx="720" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(720,560) scale(1.7)" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-9.5 -12 h10.5 l5 5 v17.5 h-15.5 Z"/>
    <path d="M1 -12 v5 h5"/>
    <path d="M-5.5 -2.5 h9 M-5.5 1 h9 M-5.5 4.5 h6"/>
    <circle cx="6.5" cy="9.5" r="4.6" fill="#FFFFFF" stroke="#E5172A"/>
    <path stroke="#E5172A" d="M4.3 9.5 l1.6 1.6 l3 -3.4"/>
  </g>
  <text x="720" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Proof &amp; Notices</text>
  <text x="720" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Selfie proof &amp;</text>
  <text x="720" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">legal notices</text>

  <!-- ============ STAGE 04 — Reminders ============ -->
  <text x="1000" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">04</text>
  <circle cx="1000" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1000,560) scale(1.7)" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -12.5 C4.2 -12.5 6.5 -9.5 6.5 -5 v3 c0 2 1.2 3 2.4 4.2 h-17.8 c1.2 -1.2 2.4 -2.2 2.4 -4.2 v-3 C-4.4 -9.5 -2.1 -12.5 0 -12.5 Z"/>
    <circle cx="0" cy="-13" r="1.3"/>
    <path d="M-2.3 6 a2.3 2.3 0 0 0 4.6 0"/>
    <circle cx="7.5" cy="-9" r="2.8" fill="#E5172A" stroke="none"/>
  </g>
  <text x="1000" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Reminders</text>
  <text x="1000" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">App &amp; email alerts</text>
  <text x="1000" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">on due PTPs</text>

  <!-- ============ STAGE 05 — Recovery ============ -->
  <text x="1280" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">05</text>
  <circle cx="1280" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1280,560) scale(1.7)" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-4.5" rx="10.5" ry="3.8"/>
    <path d="M-10.5 -4.5 v6.5 a10.5 3.8 0 0 0 21 0 v-6.5"/>
    <path d="M-10.5 -1 a10.5 3.8 0 0 0 21 0" opacity="0.45"/>
    <path stroke="#E5172A" d="M-3 -6.5 h6 M-3 -4.3 h6 M2.2 -6.5 a3 3 0 0 1 -3 3 h-2.2 l4.2 4.3"/>
  </g>
  <text x="1280" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Recovery</text>
  <text x="1280" y="738" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Payment collected</text>
  <text x="1280" y="766" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">&amp; reconciled</text>

  <!-- Divider -->
  <line x1="76" y1="900" x2="1364" y2="900" stroke="#E2E6ED" stroke-width="1.4"/>

  <!-- Stats -->
  <text x="720" y="978" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#5B6B82">RESULTS AT A GLANCE</text>

  <line x1="512" y1="1036" x2="512" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>
  <line x1="928" y1="1036" x2="928" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>

  <text x="304" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">Real-time</text>
  <text x="304" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">PER-CASE TIMELINE</text>

  <text x="720" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#E5172A">PTP</text>
  <text x="720" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">&amp; BROKEN-PTP FLAGS</text>

  <text x="1136" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">Selfie</text>
  <text x="1136" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">VERIFIED VISITS</text>

  <!-- Footer -->
  <text x="720" y="1228" text-anchor="middle" font-size="20" font-weight="500" letter-spacing="0.3" fill="#5B6B82">UPI · Netbanking · Cash &amp; QR · In-app &amp; email alerts · Built for NBFCs &amp; lenders</text>
</svg>
