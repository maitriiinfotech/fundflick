<svg width="1440" height="1340" viewBox="0 0 1440 1340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loan Management System visual workflow">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0B1B33" flood-opacity="0.12"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .flow-dot { animation: flowmove 7s linear infinite; }
      @keyframes flowmove {
        0%   { transform: translateX(0px);    opacity: 0; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { transform: translateX(1048px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-dot { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card -->
  <rect x="16" y="16" width="1408" height="1308" rx="30" fill="#FFFFFF" stroke="#E2E6ED" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Header -->
  <text x="76" y="112" font-size="20" font-weight="700" letter-spacing="2.5" fill="#5B6B82">LENDING OPERATIONS SUITE</text>
  <text x="76" y="184" font-size="56" font-weight="800" fill="#0B1B33">Loan Management System</text>
  <text x="76" y="228" font-size="26" font-weight="500" fill="#5B6B82">Schedule, track &amp; close — automated end to end</text>

  <!-- Beta badge -->
  <rect x="788" y="146" width="118" height="46" rx="23" fill="none" stroke="#E5172A" stroke-width="1.8"/>
  <text x="847" y="177" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1.5" fill="#E5172A">BETA</text>

  <!-- Top-right brand -->
  <circle cx="1356" cy="110" r="5" fill="#E5172A"/>
  <text x="1348" y="116" text-anchor="end" font-size="20" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>
  <text x="1348" y="142" text-anchor="end" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5B6B82">VISUAL WORKFLOW</text>

  <!-- Connectors -->
  <g stroke="#0B1B33" stroke-width="2.6" opacity="0.25" stroke-linecap="round">
    <line x1="226" y1="560" x2="368" y2="560"/>
    <line x1="506" y1="560" x2="648" y2="560"/>
    <line x1="786" y1="560" x2="928" y2="560"/>
    <line x1="1066" y1="560" x2="1208" y2="560"/>
  </g>
  <g fill="#0B1B33" opacity="0.35">
    <path d="M374 560 l-10 -5 v10 Z"/>
    <path d="M654 560 l-10 -5 v10 Z"/>
    <path d="M934 560 l-10 -5 v10 Z"/>
    <path d="M1214 560 l-10 -5 v10 Z"/>
  </g>

  <!-- Animated flow dot -->
  <g transform="translate(196,560)">
    <g class="flow-dot">
      <circle r="8" fill="#E5172A" filter="url(#dotGlow)"/>
    </g>
  </g>

  <!-- ============ STAGE 01 — Activation ============ -->
  <text x="160" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">01</text>
  <circle cx="160" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(160,560) scale(1.9)">
    <rect x="-10" y="-5" width="4" height="15" rx="1" fill="#0B1B33"/>
    <rect x="-3.5" y="-1" width="4" height="11" rx="1" fill="#0B1B33"/>
    <rect x="3" y="3" width="4" height="7" rx="1" fill="#0B1B33"/>
    <rect x="9.5" y="6" width="4" height="4" rx="1" fill="#E5172A"/>
  </g>
  <text x="160" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Activation</text>
  <text x="160" y="745" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Reducing-balance EMI</text>

  <!-- ============ STAGE 02 — Ledger ============ -->
  <text x="440" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">02</text>
  <circle cx="440" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(440,560) scale(1.9)">
    <rect x="-9" y="-13" width="18" height="24" rx="2" fill="none" stroke="#0B1B33" stroke-width="1.8"/>
    <line x1="-5" y1="-7" x2="5" y2="-7" stroke="#0B1B33" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#0B1B33" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-5" y1="3" x2="2" y2="3" stroke="#0B1B33" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="6" cy="8" r="3.6" fill="#E5172A"/>
  </g>
  <text x="440" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Ledger</text>
  <text x="440" y="745" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Tracked to the paisa</text>

  <!-- ============ STAGE 03 — Penalty ============ -->
  <text x="720" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">03</text>
  <circle cx="720" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(720,560) scale(1.9)">
    <circle cx="-7" cy="-7" r="4" fill="#E5172A"/>
    <circle cx="7" cy="7" r="4" fill="none" stroke="#0B1B33" stroke-width="1.8"/>
    <line x1="-9" y1="9" x2="9" y2="-9" stroke="#0B1B33" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="720" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Penalty</text>
  <text x="720" y="745" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Auto 2% yearly</text>

  <!-- ============ STAGE 04 — Reschedule ============ -->
  <text x="1000" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">04</text>
  <circle cx="1000" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1000,560) scale(1.9)">
    <path d="M -6.65,-6.65 A 9.5,9.5 0 1 1 -6.65,6.65" fill="none" stroke="#0B1B33" stroke-width="2.1" stroke-linecap="round"/>
    <polygon points="-6.65,6.65 -9.95,5.25 -8.55,9.05" fill="#0B1B33"/>
    <circle cx="7" cy="7" r="2.6" fill="#E5172A"/>
  </g>
  <text x="1000" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Reschedule</text>
  <text x="1000" y="745" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Fresh amortization</text>

  <!-- ============ STAGE 05 — Foreclosure ============ -->
  <text x="1280" y="452" text-anchor="middle" font-size="26" font-weight="800" fill="#E5172A">05</text>
  <circle cx="1280" cy="560" r="60" fill="#FFFFFF" stroke="#0B1B33" stroke-width="2.6"/>
  <g transform="translate(1280,560) scale(1.9)">
    <path d="M -11,-13 L 5,-13 L 11,-7 L 11,13 L -11,13 Z" fill="none" stroke="#0B1B33" stroke-width="1.8"/>
    <path d="M 5,-13 L 5,-7 L 11,-7" fill="none" stroke="#0B1B33" stroke-width="1.3"/>
    <line x1="-6" y1="-1" x2="2" y2="-1" stroke="#0B1B33" stroke-width="1.2"/>
    <line x1="-6" y1="3" x2="0" y2="3" stroke="#0B1B33" stroke-width="1.2"/>
    <circle cx="8" cy="9" r="5" fill="#E5172A"/>
    <path d="M 6,9 L 7.4,10.4 L 10,7.4" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1280" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1B33">Foreclosure</text>
  <text x="1280" y="745" text-anchor="middle" font-size="20" font-weight="500" fill="#5B6B82">Instant NOC &amp; SOA</text>

  <!-- Divider -->
  <line x1="76" y1="900" x2="1364" y2="900" stroke="#E2E6ED" stroke-width="1.4"/>

  <!-- Stats -->
  <text x="720" y="978" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#5B6B82">KEY CAPABILITIES</text>

  <line x1="512" y1="1036" x2="512" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>
  <line x1="928" y1="1036" x2="928" y2="1124" stroke="#E2E6ED" stroke-width="1.4"/>

  <text x="304" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">3</text>
  <text x="304" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">INTEREST MODELS</text>

  <text x="720" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#E5172A">2%/yr</text>
  <text x="720" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">OVERDUE PENALTY</text>

  <text x="1136" y="1090" text-anchor="middle" font-size="54" font-weight="800" fill="#0B1B33">Instant</text>
  <text x="1136" y="1132" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.3" fill="#5B6B82">NOC &amp; SOA</text>

  <!-- Footer -->
  <text x="720" y="1228" text-anchor="middle" font-size="20" font-weight="500" letter-spacing="0.3" fill="#5B6B82">Bank-grade security (AES-256) · Reducing-balance EMI engine · Built for NBFCs &amp; lenders</text>
</svg>
