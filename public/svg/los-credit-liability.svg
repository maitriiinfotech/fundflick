<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Credit and liability profile">
  <defs>
    <style>text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }</style>
  </defs>

  <text x="40" y="56" font-size="30" font-weight="800" fill="#0B1B33">Credit Profile</text>
