<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent performance scorecard">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
      .grow { animation: grow 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes grow { 0%,100% { transform: scaleY(.8) } 50% { transform: scaleY(1) } }
      @media (prefers-reduced-motion: reduce) { .grow { animation: none } }
    </style>
  </defs>

  <text x="40" y="56" font-size="30" font-weight="800" fill="#0B1B33">Agent Scorecard</text>
  <text x="40" y="86" font-size="15" font-weight="500" fill="#5B6B82">Per-agent performance · 15-day activity</text>
  <text x="840" y="52" text-anchor="end" font-size="14" font-weight="800" letter-spacing="2" fill="#0B1B33">FUNDFLICK</text>

  <!-- agent identity -->
  <circle cx="66" cy="138" r="22" fill="#E5172A" opacity="0.14"/>
  <text x="66" y="145" text-anchor="middle" font-size="17" font-weight="800" fill="#E5172A">AV</text>
  <text x="100" y="132" font-size="19" font-weight="800" fill="#0B1B33">Aman Verma</text>
  <text x="100" y="153" font-size="13" font-weight="500" fill="#5B6B82">Field Agent · Jaipur branch</text>
  <rect x="700" y="118" width="140" height="40" rx="20" fill="#10B981" opacity="0.13"/>
  <text x="770" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#0E9F6E">Efficiency 87%</text>

  <!-- stat cards -->
  <g>
    <rect x="40" y="184" width="188" height="92" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
    <text x="60" y="214" font-size="11" font-weight="700" letter-spacing="1" fill="#5B6B82">CASES ASSIGNED</text>
    <text x="60" y="250" font-size="28" font-weight="800" fill="#0B1B33">142</text>
  </g>
  <g>
    <rect x="244" y="184" width="188" height="92" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
    <text x="264" y="214" font-size="11" font-weight="700" letter-spacing="1" fill="#5B6B82">CASES WORKED</text>
    <text x="264" y="250" font-size="28" font-weight="800" fill="#0B1B33">128</text>
  </g>
  <g>
    <rect x="448" y="184" width="188" height="92" rx="14" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
    <text x="468" y="214" font-size="11" font-weight="700" letter-spacing="1" fill="#5B6B82">FOLLOW-UPS</text>
    <text x="468" y="250" font-size="28" font-weight="800" fill="#0B1B33">96</text>
  </g>
  <g>
    <rect x="652" y="184" width="188" height="92" rx="14" fill="#0B1B33"/>
    <text x="672" y="214" font-size="11" font-weight="700" letter-spacing="1" fill="#F1A7AD">COLLECTED</text>
    <text x="672" y="250" font-size="28" font-weight="800" fill="#FFFFFF">₹38L</text>
  </g>

  <!-- 15-day activity chart -->
  <rect x="40" y="296" width="800" height="224" rx="16" fill="#F5F7FA" stroke="#E2E6ED" stroke-width="1"/>
  <text x="66" y="332" font-size="15" font-weight="700" fill="#0B1B33">15-day activity</text>
  <text x="66" y="354" font-size="12" font-weight="500" fill="#5B6B82">daily follow-ups &amp; collections</text>
  <line x1="66" y1="486" x2="814" y2="486" stroke="#E2E6ED" stroke-width="1.4"/>
  <g>
    <rect x="74"  y="430" width="30" height="56" rx="4" fill="#C2CCDA"/>
    <rect x="122" y="408" width="30" height="78" rx="4" fill="#C2CCDA"/>
    <rect x="170" y="446" width="30" height="40" rx="4" fill="#D2D8E1"/>
    <rect x="218" y="396" width="30" height="90" rx="4" fill="#B9C2D0"/>
    <rect x="266" y="420" width="30" height="66" rx="4" fill="#C2CCDA"/>
    <rect x="314" y="384" width="30" height="102" rx="4" fill="#B9C2D0"/>
    <rect x="362" y="438" width="30" height="48" rx="4" fill="#D2D8E1"/>
    <rect x="410" y="402" width="30" height="84" rx="4" fill="#B9C2D0"/>
    <rect x="458" y="372" width="30" height="114" rx="4" fill="#8A98AD"/>
    <rect x="506" y="418" width="30" height="68" rx="4" fill="#C2CCDA"/>
    <rect x="554" y="390" width="30" height="96" rx="4" fill="#B9C2D0"/>
    <rect x="602" y="360" width="30" height="126" rx="4" fill="#8A98AD"/>
    <rect x="650" y="412" width="30" height="74" rx="4" fill="#C2CCDA"/>
    <rect x="698" y="378" width="30" height="108" rx="4" fill="#8A98AD"/>
    <rect class="grow" x="746" y="344" width="30" height="142" rx="4" fill="#E5172A"/>
  </g>
</svg>
